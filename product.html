<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product Details · Buggy Bazaar</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛒</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/product.css" />
</head>
<body>

  <a class="skip-link" href="#main-content">Skip to main content</a>

  <header class="navbar">
    <div class="navbar-inner">
      <a href="index.html" class="navbar-logo">Buggy Bazaar <span>🛒</span></a>

      <nav class="navbar-menu">
        <a href="index.html">Home</a>
        <a href="index.html#shop">Shop</a>
        <a href="index.html#categories">Categories</a>
        <a href="index.html#about">About</a>
      </nav>

      <div class="navbar-actions">
        <a href="cart.html" class="cart-link" aria-label="View cart">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="9" cy="21" r="1"></circle>
            <circle cx="20" cy="21" r="1"></circle>
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
          </svg>
          <span class="cart-count" data-cart-count>0</span>
        </a>
        <button class="navbar-toggle" aria-label="Toggle menu" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </header>

  <main id="main-content">
    <div class="section-inner">
      <a href="index.html#shop" class="back-link">← Back to Shop</a>
    </div>

    <div id="product-main">
      <section class="product-detail section-inner">
        <div class="product-detail-image">
          <img id="product-image" src="" alt="" />
        </div>

        <div class="product-detail-info">
          <span class="product-card-category" id="product-category"></span>
          <h1 id="product-name"></h1>

          <div class="product-detail-rating">
            <span id="product-rating"></span>
            <span id="product-reviews" class="product-card-reviews"></span>
          </div>

          <div class="product-detail-price">
            <span class="price-current" id="product-price"></span>
            <span class="price-original" id="product-original-price" hidden></span>
            <span class="price-discount" id="product-discount" hidden></span>
          </div>

          <span class="stock-tag" id="product-stock"></span>

          <p class="product-detail-description" id="product-description"></p>

          <div class="quantity-row">
            <span>Quantity</span>
            <div class="quantity-stepper">
              <button class="quantity-btn" id="quantity-decrease" aria-label="Decrease quantity">−</button>
              <input type="number" id="quantity-input" value="1" min="1" aria-label="Quantity" />
              <button class="quantity-btn" id="quantity-increase" aria-label="Increase quantity">+</button>
            </div>
          </div>

          <div class="product-detail-actions">
            <button class="btn btn-primary" id="add-to-cart-btn">Add to Cart</button>
            <button class="btn btn-outline" id="buy-now-btn">Buy Now</button>
          </div>
        </div>
      </section>
    </div>

    <section class="section">
      <div class="section-inner">
        <h2 class="section-title">You may also like</h2>
        <div class="product-grid" id="related-products"></div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="footer-inner">
      <div class="footer-brand">
        <span class="footer-logo">Buggy Bazaar 🛒</span>
      </div>
      <div class="footer-col">
        <h3>Quick Links</h3>
        <a href="index.html">Home</a>
        <a href="index.html#shop">Shop</a>
        <a href="cart.html">Cart</a>
        <a href="index.html#about">About</a>
      </div>
      <div class="footer-col">
        <h3>Categories</h3>
        <a href="index.html#shop">Electronics</a>
        <a href="index.html#shop">Fashion</a>
        <a href="index.html#shop">Books</a>
        <a href="index.html#shop">Home</a>
      </div>
      <div class="footer-col">
      </div>
    </div>
    <div class="footer-bottom">© 2026 Buggy Bazaar.</div>
  </footer>

  <script src="js/products.js"></script>
  <script src="js/common.js"></script>
  <script src="js/product.js"></script>
</body>
</html>
