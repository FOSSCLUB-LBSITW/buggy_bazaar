<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout · Buggy Bazaar</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛒</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/checkout.css" />
</head>
<body>

  <a class="skip-link" href="#main-content">Skip to main content</a>

  <header class="navbar">
    <div class="navbar-inner">
      <a href="index.html" class="navbar-logo">Buggy Bazaar <span>🛒</span></a>

      <nav class="navbar-menu">
        <a href="index.html">Home</a>
        <a href="index.html#shop">Shop</a>
        <a href="index.html#categories">Categories</a>
        <a href="index.html#about">About</a>
      </nav>

      <div class="navbar-actions">
        <a href="cart.html" class="cart-link" aria-label="View cart">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="9" cy="21" r="1"></circle>
            <circle cx="20" cy="21" r="1"></circle>
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
          </svg>
          <span class="cart-count" data-cart-count>0</span>
        </a>
        <button class="navbar-toggle" aria-label="Toggle menu" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </header>

  <main id="main-content">
    <section class="section">
      <div class="section-inner">
        <h1 class="section-title">Checkout</h1>

        <div class="checkout-layout">
          <form id="checkout-form" class="checkout-form" novalidate>
            <h2>Delivery Details</h2>

            <div class="form-field">
              <label for="full-name">Full Name</label>
              <input type="text" id="full-name" name="full-name" autocomplete="name" />
              <span class="field-error" id="error-name"></span>
            </div>

            <div class="form-row">
              <div class="form-field">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" autocomplete="email" />
                <span class="field-error" id="error-email"></span>
              </div>
              <div class="form-field">
                <label for="phone">Phone</label>
                <input type="tel" id="phone" name="phone" autocomplete="tel" />
                <span class="field-error" id="error-phone"></span>
              </div>
            </div>

            <div class="form-field">
              <label for="address">Address</label>
              <input type="text" id="address" name="address" autocomplete="street-address" />
              <span class="field-error" id="error-address"></span>
            </div>

            <div class="form-row form-row-three">
              <div class="form-field">
                <label for="city">City</label>
                <input type="text" id="city" name="city" autocomplete="address-level2" />
                <span class="field-error" id="error-city"></span>
              </div>
              <div class="form-field">
                <label for="state">State</label>
                <input type="text" id="state" name="state" autocomplete="address-level1" />
                <span class="field-error" id="error-state"></span>
              </div>
              <div class="form-field">
                <label for="pincode">PIN Code</label>
                <input type="text" id="pincode" name="pincode" autocomplete="postal-code" inputmode="numeric" />
                <span class="field-error" id="error-pincode"></span>
              </div>
            </div>

            <h2>Payment Method</h2>

            <div class="payment-options">
              <label class="payment-option">
                <input type="radio" name="payment-method" value="upi" checked />
                <span>UPI</span>
              </label>
              <label class="payment-option">
                <input type="radio" name="payment-method" value="card" />
                <span>Credit / Debit Card</span>
              </label>
              <label class="payment-option">
                <input type="radio" name="payment-method" value="cod" />
                <span>Cash on Delivery</span>
              </label>
            </div>

            <div class="payment-fields" id="upi-fields">
              <div class="form-field">
                <label for="upi-id">UPI ID</label>
                <input type="text" id="upi-id" name="upi-id" placeholder="yourname@upi" />
              </div>
            </div>

            <div class="payment-fields" id="card-fields" hidden>
              <div class="form-field">
                <label for="card-number">Card Number</label>
                <input type="text" id="card-number" name="card-number" placeholder="1234 5678 9012 3456" />
              </div>
              <div class="form-row">
                <div class="form-field">
                  <label for="card-expiry">Expiry Date</label>
                  <input type="text" id="card-expiry" name="card-expiry" placeholder="MM/YY" />
                </div>
                <div class="form-field">
                  <label for="card-cvv">CVV</label>
                  <input type="text" id="card-cvv" name="card-cvv" placeholder="123" />
                </div>
              </div>
            </div>

            <button type="submit" class="btn btn-primary btn-full">Place Order</button>
          </form>

          <aside class="checkout-summary">
            <h2>Order Summary</h2>
            <div id="checkout-items" class="checkout-items"></div>
            <dl class="summary-rows">
              <div class="summary-row">
                <dt>Subtotal</dt>
                <dd id="checkout-subtotal">₹0</dd>
              </div>
              <div class="summary-row">
                <dt>Delivery</dt>
                <dd id="checkout-delivery">₹0</dd>
              </div>
              <div class="summary-row summary-row-total">
                <dt>Total</dt>
                <dd id="checkout-total">₹0</dd>
              </div>
            </dl>
          </aside>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="footer-inner">
      <div class="footer-brand">
        <span class="footer-logo">Buggy Bazaar 🛒</span>
      </div>
      <div class="footer-col">
        <h3>Quick Links</h3>
        <a href="index.html">Home</a>
        <a href="index.html#shop">Shop</a>
        <a href="cart.html">Cart</a>
        <a href="index.html#about">About</a>
      </div>
      <div class="footer-col">
        <h3>Categories</h3>
        <a href="index.html#shop">Electronics</a>
        <a href="index.html#shop">Fashion</a>
        <a href="index.html#shop">Books</a>
        <a href="index.html#shop">Home</a>
      </div>
      <div class="footer-col">
      </div>
    </div>
    <div class="footer-bottom">© 2026 Buggy Bazaar.</div>
  </footer>

  <script src="js/products.js"></script>
  <script src="js/common.js"></script>
  <script src="js/checkout.js"></script>
</body>
</html>
